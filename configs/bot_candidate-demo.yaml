# N-MIND Agent Runtime R1 —— candidate-demo 档：演示"显式授权后的候选更新"用
# 与 demo 档一样把冷却调小，另外把四臂对照的预算写成可直接执行的值。
# 注意 authorized 仍是 false：真正训练必须由人敲 `bot candidate --i-authorize`，
# 本文件只准备好预算，不构成授权；promotion_mode 保持 manual。
bot:
  enabled: true
  auto_start_with_os: false
  idle_learning_enabled: true
  user_task_priority: true
  single_instance: true
  network_enabled: false
  auto_candidate_training: false
  promotion_mode: manual
  allow_external_code_execution: false
  allow_remote_model_api: false
  practice_task_allowlist: [arithmetic, json_extract, grid_rules]
  max_tasks_per_idle_cycle: 3
  min_cooldown_seconds: 3
  max_idle_cpu_percent: 50
  max_rss_mb: 2048
  max_disk_mb: 512
  max_network_requests_per_cycle: 0
  max_optimizer_steps_per_cycle: 0
  max_training_wall_seconds_per_cycle: 0
  max_consecutive_failures: 3
  stable_checkpoint_readonly: true
  scheduler_verified_threshold: 8
  scheduler_max_updates_per_batch: 120
  heldout_per_family: 8

candidate:
  authorized: false
  # 下面两项都是"跨所有会训练的臂合计"的硬上限：
  # neural 与 negative 对照各拿一半（48 → 每臂 24 步；60 s → 每臂 30 s）。
  max_steps: 48
  max_wall_s: 60
  lambda_replay: 0.15
  arms: [frozen, memory, neural, negative]

name: N-Cell V3.7 architecture checks

on:
  pull_request:
    paths:
      - 'src/nmind/core/ncell.py'
      - 'src/nmind/language/neural_dialogue.py'
      - 'tests/test_ncell_architecture_v37.py'
      - '.github/workflows/ncell-v37-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncell-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Architecture and prior neural regression tests
        run: |
          python -m pytest tests/test_ncell_architecture_v37.py tests/test_ncell.py tests/test_router.py tests/test_router_ste.py tests/test_language_m5.py tests/test_gateb004_fixes.py -q
      - name: Full repository tests
        run: python -m pytest tests -q
